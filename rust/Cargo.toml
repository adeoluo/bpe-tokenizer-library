[package]
name = "bpe-tokenizer-rs"
version = "0.4.1"
edition = "2024"
description = "Rust core of bpe-tokenizer-library: byte-level BPE (GPT-2 algorithm) with Python bindings"
license = "MIT"
authors = ["Adeolu Ogunnoiki"]
repository = "https://github.com/adeoluo/bpe-tokenizer-library"
publish = false

[lib]
name = "bpe_tokenizer_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled by maturin (see pyproject.toml). Plain `cargo test` builds the pure
# Rust core without linking against Python.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py312"] }
rayon = "1.12"

[profile.release]
lto = true
codegen-units = 1
