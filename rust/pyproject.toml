[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "bpe-tokenizer-rs"
version = "0.2.0"
description = "Rust core (PyO3 extension) for bpe-tokenizer-library"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[tool.maturin]
module-name = "bpe_tokenizer_rs"
features = ["python"]
